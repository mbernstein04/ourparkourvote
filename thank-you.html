<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Our Park, Our Vote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;600;700&family=Righteous&display=swap" rel="stylesheet">
<style>
:root {
  --forest: #122a18;
  --gold: #d49b2a;
  --gold-light: #f0b84e;
  --night: #0c1824;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--night);
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
nav {
  background: var(--night);
  padding: 0 2rem;
  display: flex; align-items: center;
  height: 56px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav-brand {
  font-family: 'Righteous', sans-serif;
  font-size: 1rem; color: var(--gold-light);
  text-decoration: none; letter-spacing: 0.05em; text-transform: uppercase;
}
.main {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 4rem 2rem;
  background-image: url('lester-sunrise.jpg');
  background-size: cover; background-position: center 40%;
  position: relative;
}
.main::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(170deg, rgba(12,24,36,0.88) 0%, rgba(18,42,24,0.80) 100%);
  pointer-events: none;
}
.card {
  position: relative; z-index: 1;
  max-width: 520px; width: 100%;
  text-align: center;
}
.checkmark {
  width: 64px; height: 64px;
  background: rgba(212,155,42,0.15);
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.75rem;
  font-size: 1.6rem;
}
.label {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 900; line-height: 1.15; color: #fff;
  margin-bottom: 1rem;
}
h1 em { font-style: italic; color: var(--gold); }
p {
  font-size: 1rem; color: rgba(255,255,255,0.72);
  line-height: 1.8; margin-bottom: 2rem;
}
.divider {
  width: 60px; height: 2px;
  background: linear-gradient(90deg, var(--gold), var(--gold-light));
  margin: 0 auto 2rem; border-radius: 2px;
}
.btn-home {
  display: inline-block;
  border: 2px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.8);
  padding: 0.75rem 2rem; border-radius: 8px;
  font-weight: 700; font-size: 0.82rem;
  letter-spacing: 0.1em; text-transform: uppercase;
  text-decoration: none;
  transition: border-color 0.2s, color 0.2s;
}
.btn-home:hover { border-color: var(--gold-light); color: var(--gold-light); }
footer {
  background: var(--night); color: rgba(255,255,255,0.35);
  padding: 1.5rem 2rem; text-align: center;
  border-top: 1px solid rgba(255,255,255,0.06);
}
.footer-brand {
  font-family: 'Righteous', sans-serif; font-size: 1rem; color: var(--gold-light);
  text-transform: uppercase; margin-bottom: 0.3rem;
}
footer p { font-size: 0.78rem; line-height: 1.8; }
footer a { color: var(--gold-light); text-decoration: none; }
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/"><span style="color:#fff">Our</span> Park. <span style="color:#fff">Our</span> Vote.</a>
</nav>

<div class="main">
  <div class="card">
    <div class="checkmark">✦</div>
    <p class="label">You're in</p>
    <h1>Thank You for<br><em>Stepping Up.</em></h1>
    <div class="divider"></div>
    <p>We'll be in touch shortly.</p>
    <a href="/" class="btn-home">← Back to Home</a>
  </div>
</div>

<footer>
  <div class="footer-brand"><span style="color:#fff">Our</span> Park. <span style="color:#fff">Our</span> Vote.</div>
  <p>Not-for-profit · 1346 W. Arrowhead Rd. #324, Duluth MN 55811</p>
  <p><a href="mailto:info@ourparkourvote.org">info<!---->@<!---->ourparkourvote.org</a></p>
</footer>

</body>
</html>
